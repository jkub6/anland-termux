plugins {
    id "com.android.application" version "9.4.0"
    id "org.jetbrains.kotlin.plugin.compose" version "2.3.21"
}

android {
    namespace = "com.anland.termux"
    compileSdk = 37
    compileSdkMinor = 2

    buildFeatures {
        buildConfig = true
        resValues = true
        aidl = true
        compose = true
    }

    signingConfigs {
        nixOnDroid {
            // Use the main app's key in the workspace; retain standalone fork builds.
            def sharedKey = rootProject.file("../../nix-on-droid-app/app/testkey_untrusted.jks")
            storeFile = sharedKey.exists() ? sharedKey : rootProject.file("testkey_untrusted.jks")
            keyAlias = "alias"
            storePassword = "xrj45yWGLbsO7W0v"
            keyPassword = "xrj45yWGLbsO7W0v"
        }
        termuxGitHub {
            storeFile = rootProject.file("testkey_untrusted.jks")
            keyAlias = "alias"
            storePassword = "xrj45yWGLbsO7W0v"
            keyPassword = "xrj45yWGLbsO7W0v"
        }
    }

    defaultConfig {
        applicationId = "com.anland.termux"
        minSdk = 30
        targetSdk = 37
        versionCode = 10
        versionName = "5.13.4.1"
        buildConfigField "String", "DEFAULT_SOCKET_PATH", '"/data/data/com.termux/files/usr/tmp/anland/display_daemon.sock"'
        resValue "string", "application_id", "com.anland.termux"
        manifestPlaceholders = [appLabel: "Anland Termux"]

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=none"
            }
        }
    }

    flavorDimensions "transport"
    productFlavors {
        nixOnDroid {
            dimension "transport"
            applicationId = "com.anland.nix"
            // The first package to start a shared process determines Android's
            // compatibility behavior. Match the host, including its ability to
            // execute PRoot from app data and its legacy foreground service.
            targetSdk = 28
            versionNameSuffix "-nix"
            signingConfig = signingConfigs.nixOnDroid
            buildConfigField "boolean", "COMPATIBLE", "false"
            buildConfigField "String", "DEFAULT_SOCKET_PATH", '"/data/data/com.termux.nix/files/usr/tmp/anland/display_daemon.sock"'
            resValue "string", "application_id", "com.anland.nix"
            manifestPlaceholders = [appLabel: "Anland Nix"]
        }
        standard {
            dimension "transport"
            signingConfig = signingConfigs.termuxGitHub
            buildConfigField "boolean", "COMPATIBLE", "false"
        }
        compatible {
            dimension "transport"
            signingConfig = signingConfigs.termuxGitHub
            buildConfigField "boolean", "COMPATIBLE", "true"
            versionNameSuffix "-compatible"
        }
    }

    ndkVersion = "29.0.14206865"

    externalNativeBuild {
        cmake {
            path = file("src/main/jni/CMakeLists.txt")
        }
    }

    packaging {
        dex {
            useLegacyPackaging = true
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    buildTypes {
        debug {
            // Flavor signing must win over the Android plugin's default debug key.
            signingConfig = null
            optimization {
                enable = true
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
        }
        release {
            optimization {
                enable = true
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:2026.09.00")
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.animation:animation"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
}
